<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<link rel="icon" type="image/png" href="assets/icon192.png"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icon180.png"><meta name="theme-color" content="#5ec8ff"><title>宝宝工程车</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none;font-family:"PingFang SC","Noto Sans SC",sans-serif}
svg{overflow:visible}.tap{cursor:pointer;pointer-events:auto}
/* ---------- background ---------- */
#bg{position:fixed;inset:0;background:url(assets/bg.webp) center bottom/cover,#8fdcff;overflow:hidden}#bg .hill,#bg .tree,#crane,#ground{display:none}
.abs{position:absolute}
#sun{left:4vw;top:3vh;width:22vmin;animation:sunrot 6s ease-in-out infinite}
@keyframes sunrot{50%{transform:rotate(8deg) scale(1.05)}}
.rays{transform-origin:50px 50px;animation:spin 20s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.cloud{width:26vmin;animation:drift linear infinite}@keyframes drift{from{transform:translateX(-35vmin)}to{transform:translateX(110vw)}}
.cloud svg{width:100%;transition:transform .3s}
.bird{width:7vmin;animation:fly linear infinite}@keyframes fly{from{transform:translateX(110vw)}to{transform:translateX(-15vw)}}
.wing{transform-origin:20px 15px;animation:flap .35s ease-in-out infinite alternate}@keyframes flap{to{transform:scaleY(-1)}}
.hill{bottom:22vh;width:220vw;height:30vh;animation:par linear infinite}@keyframes par{to{transform:translateX(-110vw)}}
#ground{left:0;right:0;bottom:0;height:30vh;background:linear-gradient(#9ad65a,#6fb83a 30%,#c8935a 31%,#b07a45);box-shadow:inset 0 1vh 0 #b6e77a}
.tree{width:12vmin;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
#crane{right:3vw;bottom:24vh;width:34vmin}
.jib{transform-origin:60px 30px;animation:jib 9s ease-in-out infinite alternate}@keyframes jib{from{transform:scaleX(1)}to{transform:scaleX(-.6)}}
.hook{animation:hook 3s ease-in-out infinite alternate}@keyframes hook{to{transform:translateY(25px)}}
.flag{transform-origin:0 50%;animation:wave .6s ease-in-out infinite alternate}@keyframes wave{to{transform:skewY(12deg) scaleX(.85)}}
.cone{width:8vmin;bottom:3vh}
.dust{width:6vmin;height:6vmin;border-radius:50%;background:#e8cfa8;opacity:0;animation:dust 4s ease-out infinite}@keyframes dust{0%{opacity:.8;transform:scale(.3)}100%{opacity:0;transform:translate(-6vmin,-8vmin) scale(1.8)}}
.boing{animation:boing .6s!important}@keyframes boing{30%{transform:scale(1.35,.7)}60%{transform:scale(.8,1.3) translateY(-4vmin)}}
.jump{animation:jumpA .7s!important}@keyframes jumpA{40%{transform:translateY(-12vmin) rotate(25deg)}}
.spinme{animation:spin .8s!important}
/* ---------- screens ---------- */
.scr{position:fixed;inset:0;display:none;pointer-events:none}.on{display:block}
.scr>*{pointer-events:auto}
#topbar{position:fixed;top:2vmin;right:2vmin;display:flex;gap:2vmin;z-index:30}
.rb{width:13vmin;height:13vmin;border-radius:50%;background:#fff;border:.8vmin solid #ffd23f;font-size:6.5vmin;box-shadow:0 1vmin 0 #0003;display:flex;align-items:center;justify-content:center;padding:0}
.rb:active{transform:scale(.9)}#home{position:fixed;left:2vmin;top:2vmin;z-index:30;display:none}
.lbl{position:fixed;top:3vmin;left:50%;transform:translateX(-50%);background:#fff9;padding:1vmin 4vmin;border-radius:5vmin;color:#e65100;font-size:4.2vmin;font-weight:900;pointer-events:none}
#title{position:absolute;top:4vh;left:50%;transform:translateX(-50%);font-size:9vmin;font-weight:900;color:#ffdd33;-webkit-text-stroke:.5vmin #e65100;text-shadow:0 1vmin 0 #e65100;animation:tit 2s ease-in-out infinite;pointer-events:none;white-space:nowrap}
@keyframes tit{50%{transform:translateX(-50%) scale(1.08) rotate(-2deg)}}
#btns{position:absolute;inset:16vh 0 auto 0;display:flex;flex-wrap:wrap;justify-content:center;gap:4vmin;pointer-events:none}
.big{pointer-events:auto;width:34vmin;height:34vmin;border-radius:7vmin;border:1.2vmin solid #fff;box-shadow:0 2vmin 0 #0004,inset 0 -2vmin 0 #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:4vmin;color:#fff;font-weight:900;text-shadow:0 .4vmin #0004;animation:bb 2.4s ease-in-out infinite}
.big:nth-child(2){animation-delay:.4s}.big:nth-child(3){animation-delay:.8s}
@keyframes bb{50%{transform:translateY(-1.8vmin) rotate(2deg)}}
.big svg{width:78%;height:68%}.big:active{transform:scale(.92)}
#stickers{position:absolute;left:50%;bottom:2vh;transform:translateX(-50%);background:#fffc;border-radius:4vmin;padding:1vmin 3vmin;display:flex;flex-wrap:wrap;justify-content:center;max-width:94vw;gap:.5vmin;font-size:6vmin;min-height:9vmin;align-items:center;box-shadow:0 1vmin 0 #0002}
#stickers:empty::before{content:"⭐ 贴纸收集册";font-size:3.5vmin;color:#999}
.drv{position:absolute;width:24vmin;animation:drive linear infinite;pointer-events:none}@keyframes drive{from{transform:translateX(-30vmin)}to{transform:translateX(115vw)}}
.drv.rev{animation-name:driveR}@keyframes driveR{from{transform:translateX(115vw) scaleX(-1)}to{transform:translateX(-30vmin) scaleX(-1)}}
/* trucks */
.wh{transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite}
.lid{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.puff{animation:puff 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}.puff2{animation-delay:.7s}
@keyframes puff{0%{opacity:.8;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(-25px,-30px) scale(1.6)}}
.dance{animation:dance .5s ease-in-out infinite alternate}@keyframes dance{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-2vmin) rotate(3deg)}}
.hint{animation:hint 1s ease-in-out infinite}@keyframes hint{50%{transform:translateY(-2vmin) scale(1.05)}}
/* game1 */
#ex{position:absolute;left:2vw;bottom:8vh;width:48vmin}#dt{position:absolute;right:3vw;bottom:8vh;width:50vmin}
#arm{transform-origin:150px 90px;transition:transform .35s}.dig #arm{transform:rotate(28deg)}
#hand{position:absolute;font-size:10vmin;left:22vmin;bottom:42vh;animation:hint 1s infinite;pointer-events:none}
/* game2 */
#garages{position:absolute;top:15vh;width:100%;display:flex;justify-content:space-around;pointer-events:none}
.gar{width:20vmin;height:22vmin;pointer-events:auto;filter:drop-shadow(0 1vmin 0 #0003)}
#ctruck{position:absolute;bottom:4vh;left:50%;width:36vmin;margin-left:-18vmin;touch-action:none}
/* game3 */
#rocks{position:absolute;left:4vw;bottom:8vh;display:flex;flex-wrap:wrap;width:40vw;gap:3vmin;pointer-events:none}
.rock{width:18vmin;height:15vmin;pointer-events:auto;filter:drop-shadow(0 1vmin 0 #0003)}
#ctr{position:absolute;right:3vw;bottom:8vh;width:50vmin}
#num{position:absolute;top:13vh;left:50%;transform:translateX(-50%);display:flex;gap:3vmin;pointer-events:none}
.dot{width:13vmin;height:13vmin;border-radius:50%;background:#fff;border:1vmin solid #ff9800;display:flex;align-items:center;justify-content:center;font-size:7vmin;font-weight:900;color:#fff;transition:transform .3s}.dot.f{background:#ff9800;transform:scale(1.2)}
/* celebration */
#cel{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
.conf{position:absolute;width:2.5vmin;height:4vmin;top:-5vh;animation:fall 2s linear forwards;border-radius:.5vmin}@keyframes fall{to{transform:translateY(110vh) rotate(900deg)}}
.spark{position:absolute;width:2vmin;height:2vmin;border-radius:50%;animation:fw 1.1s ease-out forwards}@keyframes fw{to{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}
.bal{position:absolute;bottom:-25vmin;width:13vmin;animation:rise 3s ease-in forwards}@keyframes rise{to{transform:translateY(-140vh) rotate(10deg)}}
#bigtruck{position:absolute;left:50%;top:50%;width:46vmin;margin:-20vmin 0 0 -23vmin;transform:scale(0);transition:transform .4s cubic-bezier(.3,1.6,.6,1)}
#bigtruck.show{transform:scale(1)}#bigtruck svg{width:100%;animation:dance .3s ease-in-out infinite alternate}
#stk{position:absolute;left:50%;top:18%;font-size:18vmin;transform:translate(-50%,-50%) scale(0);transition:transform .4s cubic-bezier(.3,1.6,.6,1)}#stk.show{transform:translate(-50%,-50%) scale(1) rotate(360deg)}

.big{width:30vmin;height:30vmin}#btns{gap:3vmin}
.big:nth-child(4){animation-delay:1.2s}
#gar{position:absolute;top:13vh;left:3vw;right:3vw;bottom:2vh;display:grid;grid-template-columns:repeat(auto-fill,minmax(26vmin,1fr));gap:2.5vmin;overflow:hidden;pointer-events:auto}
.vc{background:#fffd;border-radius:4vmin;border:.8vmin solid #ffd23f;box-shadow:0 1vmin 0 #0003;display:flex;align-items:center;justify-content:center;padding:1vmin}
.vc svg{width:100%;height:100%;max-height:22vmin}.vc:active{transform:scale(.94)}
.act{transform-box:fill-box;transform-origin:50% 100%}
@keyframes vb{25%{transform:translateY(-14%) scale(1.04,.96)}50%{transform:scale(1.06,.92)}75%{transform:translateY(-6%)}}
@keyframes vt{30%{transform:rotate(-6deg)}60%{transform:rotate(3deg)}}
@keyframes vs{10%,30%,50%,70%{transform:translateX(-2%) rotate(-1deg)}20%,40%,60%,80%{transform:translateX(2%) rotate(1deg)}}
@keyframes vd{40%{transform:translateX(9%)}70%{transform:translateX(-3%)}}
.fx circle,.fx path{opacity:0;transform-box:fill-box;transform-origin:center}
.go .fx .du{animation:du 1.2s ease-out}.go .fx .du:nth-child(2){animation-delay:.15s}.go .fx .du:nth-child(3){animation-delay:.3s}
@keyframes du{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:translate(-40px,-25px) scale(2.2)}}
.go .fx .sp{animation:spk 1.1s ease-out}.go .fx .sp:nth-child(5){animation-delay:.25s}.go .fx .sp:nth-child(6){animation-delay:.45s}
@keyframes spk{0%{opacity:0;transform:scale(0) rotate(0)}40%{opacity:1;transform:scale(1.3) rotate(90deg)}100%{opacity:0;transform:scale(.4) rotate(180deg)}}
.go .fx .wa{animation:wa 1.2s ease-out}@keyframes wa{0%{opacity:0}20%,70%{opacity:.85}100%{opacity:0;transform:translate(-30px,10px)}}
.go .act{animation:var(--a) 1.2s ease-in-out}
.go{animation:dance .3s ease-in-out 4 alternate}
.spray{opacity:0}.go .spray{animation:spr 1.2s}@keyframes spr{20%,80%{opacity:1}}
.siren{animation:blinkc .5s steps(1) infinite}@keyframes blinkc{50%{fill:#2196f3}}
@keyframes tip{50%{transform:rotate(-32deg)}}@keyframes digA{50%{transform:rotate(28deg)}}@keyframes push{50%{transform:translateX(22px)}}
@keyframes lift{50%{transform:rotate(-22deg)}}@keyframes up{50%{transform:translateY(-45px)}}@keyframes drill{50%{transform:translateY(28px)}}
@keyframes scoop{50%{transform:rotate(-30deg)}}@keyframes rollA{50%{transform:translateX(18px)}}
#nm{position:fixed;left:50%;bottom:4vh;transform:translateX(-50%) scale(0);background:#fff;border-radius:5vmin;padding:1.5vmin 5vmin;font-size:7vmin;font-weight:900;color:#e65100;z-index:35;transition:transform .3s cubic-bezier(.3,1.6,.6,1);pointer-events:none}#nm.show{transform:translateX(-50%) scale(1)}
#rocks{width:46vw}.rock{width:15vmin;height:13vmin}

.big{width:21vmin;height:21vmin;border-radius:5vmin;border-width:.9vmin;font-size:3vmin}#btns{inset:15vh 4vw auto 4vw;gap:2.5vmin}
.big:nth-child(5){animation-delay:.2s}.big:nth-child(6){animation-delay:.6s}.big:nth-child(7){animation-delay:1s}.big:nth-child(8){animation-delay:1.4s}
.ch{position:absolute;top:16vh;bottom:5vh;left:3vw;right:3vw;display:flex;justify-content:space-around;align-items:center;pointer-events:none}
.card{pointer-events:auto;background:#fffd;border-radius:5vmin;border:1vmin solid #ffd23f;box-shadow:0 1.5vmin 0 #0003;display:flex;align-items:center;justify-content:center;width:28vw;max-width:42vmin;aspect-ratio:1.2}
.card svg{width:90%}.card:active{transform:scale(.94)}
.sil svg{filter:brightness(0);opacity:.4}.sil svg .fx,.sil svg>ellipse{display:none}
#drag8{position:absolute;bottom:3vh;left:50%;width:30vmin;margin-left:-15vmin;touch-action:none}
#c8{bottom:40vh;top:14vh}
#replay{position:absolute;left:50%;bottom:4vh;transform:translateX(-50%);width:18vmin;height:18vmin;font-size:10vmin}
#road{position:absolute;left:3vw;right:3vw;bottom:2vh;height:13vmin;background:#5d4037;border-radius:7vmin;border:.8vmin solid #fff;display:flex;align-items:center;justify-content:space-around;padding:0 2vmin;box-shadow:0 1vmin 0 #0003;background-image:repeating-linear-gradient(90deg,#ffeb3b 0 3vmin,transparent 3vmin 6vmin);background-size:100% .8vmin;background-position:center;background-repeat:no-repeat;background-color:#5d4037}
#road svg{width:9vmin;height:9vmin}#road .lock svg{filter:brightness(0) invert(1);opacity:.35}
#stickers{display:none}
html,body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

<script>
const $=s=>document.querySelector(s),R=Math.random,pick=a=>a[Math.floor(R()*a.length)];
const DK={'#e53935':'#b71c1c','#fdd835':'#f9a825','#1e88e5':'#0d47a1','#43a047':'#1b5e20','#ff9800':'#e65100','#ab47bc':'#6a1b9a','#00acc1':'#006064','#d32f2f':'#7f0000'};const shade=c=>DK[c]||'#0005';
function face(x,y){return `<g><circle cx="${x}" cy="${y}" r="11" fill="#fff" stroke="#333" stroke-width="2"/><circle cx="${x+22}" cy="${y}" r="11" fill="#fff" stroke="#333" stroke-width="2"/><g class="lid"><circle cx="${x+3}" cy="${y+1}" r="6" fill="#222"/><circle cx="${x+25}" cy="${y+1}" r="6" fill="#222"/><circle cx="${x+5}" cy="${y-2}" r="2" fill="#fff"/><circle cx="${x+27}" cy="${y-2}" r="2" fill="#fff"/></g><circle cx="${x-6}" cy="${y+16}" r="5" fill="#ff8a80" opacity=".8"/><circle cx="${x+30}" cy="${y+16}" r="5" fill="#ff8a80" opacity=".8"/><path d="M${x+2} ${y+16}q9 10 18 0" stroke="#333" stroke-width="3" fill="#c62828" stroke-linecap="round"/></g>`}

const COLS=['#e53935','#fdd835','#1e88e5','#43a047'],CN=['红色','黄色','蓝色','绿色'];let tc,g2busy=false,w2=0,shown=[];
function s2(){g2busy=false;const n=Math.min(4,2+Math.floor(w2/3));shown=[0,1,2,3].sort(()=>R()-.5).slice(0,n);tc=pick(shown);const vt=pick([['fire','crane'],['excavator','bulldozer','loader','tow'],['mixer'],['water','roller']][tc]);
 $('#garages').innerHTML=shown.map(i=>`<svg class="gar tap" data-i="${i}" viewBox="0 0 100 110"><path d="M5 42L50 5l45 37v63H5z" fill="${COLS[i]}" stroke="#fff" stroke-width="5" stroke-linejoin="round"/><rect x="20" y="52" width="60" height="53" rx="4" fill="#37474f"/><path d="M20 62h60M20 72h60M20 82h60M20 92h60" stroke="#546e7a" stroke-width="3"/><circle cx="50" cy="30" r="8" fill="#fff"/></svg>`).join('');
 const t=$('#ctruck');t.setAttribute('viewBox','-20 -60 300 230');t.style.transition='none';t.style.transform='';t.innerHTML=veh(vt,COLS[tc]);t.dataset.t=vt;t.classList.add('hint');
 ask(CN[tc]+'的'+V[vt].n+'，开回'+CN[tc]+'的家');
 document.querySelectorAll('.gar').forEach(g=>g.onpointerdown=()=>{ac();if(+g.dataset.i==tc)go(g);else{hint();g.animate([{transform:'rotate(0)'},{transform:'rotate(4deg)'},{transform:'rotate(-4deg)'},{transform:'rotate(0)'}],400)}})}
function go(g){if(g2busy)return;g2busy=true;w2++;const t=$('#ctruck'),r=g.getBoundingClientRect();t.classList.remove('hint');t.style.transition='none';t.style.transform='';const q=t.getBoundingClientRect();t.style.transition='transform .8s';t.style.transform=`translate(${r.left+r.width/2-q.left-q.width/2}px,${r.top+r.height/2-q.top-q.height/2}px) scale(.4)`;anim(g,'boing',600);celebrate(()=>{if(cur=='g2')s2()},t.dataset.t)}
(()=>{const t=$('#ctruck');let sx,sy,drag=false;t.addEventListener('pointerdown',e=>{if(g2busy)return;ac();pop();drag=true;sx=e.clientX;sy=e.clientY;t.classList.remove('hint');t.style.transition='none';try{t.setPointerCapture(e.pointerId)}catch(_){}});t.addEventListener('pointermove',e=>{if(drag)t.style.transform=`translate(${e.clientX-sx}px,${e.clientY-sy}px) rotate(${(e.clientX-sx)/40}deg)`});t.addEventListener('pointerup',e=>{if(!drag)return;drag=false;const g=[...document.querySelectorAll('.gar')].find(g=>{const r=g.getBoundingClientRect();return e.clientX>r.left-50&&e.clientX<r.right+50&&e.clientY>r.top-50&&e.clientY<r.bottom+80});t.style.transition='transform .4s';t.style.transform='';t.classList.add('hint');if(g){if(+g.dataset.i==tc)go(g);else hint()}else if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>30)hint();else ask(lastQ)})})();
/* ---------- game 3: count 1-3, later up to 5 ---------- */
const NUM=['一','二','三','四','五'];let need,have,w3=0,ct;
const rockSvg=`<svg class="rock tap hint" viewBox="0 0 100 80"><path d="M8 72L18 25 50 6 86 20 96 72z" fill="#a1887f" stroke="#6d4c41" stroke-width="5" stroke-linejoin="round"/><circle cx="40" cy="42" r="4" fill="#333"/><circle cx="62" cy="42" r="4" fill="#333"/><path d="M42 54q9 7 18 0" stroke="#333" stroke-width="3" fill="none"/></svg>`;
function s3(){const mx=w3<6?3:5;need=1+Math.floor(R()*mx);have=0;ct=pick(['dump','loader','tow','forklift','mixer']);ct=ct=='dump'||ct=='loader'?ct:'dump';$('#num').innerHTML='<div class="dot"></div>'.repeat(need);$('#rocks').innerHTML=rockSvg.repeat(need);drawCT();ask('装'+(need==2?'两':NUM[need-1])+'块石头');
 document.querySelectorAll('.rock').forEach(r=>r.onpointerdown=()=>{if(r.dataset.u)return;ac();r.dataset.u=1;r.style.visibility='hidden';have++;pop(have);say(NUM[have-1]);const d=$('#num').children[have-1];d.classList.add('f');d.textContent=have;drawCT();anim($('#ctr'),'boing',600);if(have==need){w3++;setTimeout(()=>celebrate(()=>{if(cur=='g3')s3()},'dump'),700)}})}
function drawCT(){let l='';for(let i=0;i<have;i++)l+=`<path d="M${22+(i%3)*42} ${52-Math.floor(i/3)*20}l8-24 22-9 20 11 4 22z" fill="#a1887f" stroke="#6d4c41" stroke-width="3"/>`;$('#ctr').innerHTML=truck(null,l)}
/* ---------- game 4: vehicle garage ---------- */
function s4(){$('#gar').innerHTML=TYPES.map(t=>`<div class="vc tap" data-t="${t}"><svg viewBox="-20 -60 300 230">${veh(t)}</svg></div>`).join('');ask('点一点，认识工程车');
 document.querySelectorAll('.vc').forEach(c=>c.onpointerdown=()=>{ac();const t=c.dataset.t;act(c.querySelector('svg'),t);say(V[t].n,150);const nm=$('#nm');nm.textContent=V[t].n;nm.classList.add('show');clearTimeout(nm._t);nm._t=setTimeout(()=>nm.classList.remove('show'),1600)})}


/* ---------- choice games 5-8 ---------- */
let W=JSON.parse(localStorage.getItem('tt_w')||'{}'),gbusy=false;
const wn=g=>W[g]||0,nC=g=>wn(g)>=3?3:2;
function shuffle(a){return a.sort(()=>R()-.5)}
function cardsHTML(list,fn){return list.map((x,i)=>`<div class="card tap" data-i="${i}">${fn(x,i)}</div>`).join('')}
function choice(g,list,ok,fn,q,onAsk,wrap=''){gbusy=false;const c=$('#c'+g[1]);c.innerHTML=cardsHTML(list,(x,i)=>`<div class="${wrap}" style="width:100%;display:flex;justify-content:center"><svg viewBox="-20 -60 300 230" style="width:${x.sz||90}%">${veh(x.t,x.c)}</svg></div>`);ask(q);if(onAsk)onAsk();
 c.querySelectorAll('.card').forEach(el=>el.onpointerdown=()=>{if(gbusy)return;ac();const x=list[+el.dataset.i];if(ok(x)){gbusy=true;W[g]=wn(g)+1;act(el.querySelector('svg'),x.t);anim(el,'boing',600);setTimeout(()=>celebrate(()=>{if(cur==g)({g5:s5,g6:s6,g7:s7,g8:s8})[g]()},x.t),500)}else{hint();if(onAsk)setTimeout(onAsk,2200);el.animate([{transform:'rotate(0)'},{transform:'rotate(4deg)'},{transform:'rotate(-4deg)'},{transform:'rotate(0)'}],400)}})}
function s5(){const ts=shuffle([...TYPES]).slice(0,nC('g5')),t=pick(ts);choice('g5',ts.map(x=>({t:x})),x=>x.t==t,null,'哪个是'+V[t].n+'？')}
let snd6;function s6(){const ts=shuffle([...TYPES]).slice(0,nC('g6')),t=pick(ts);snd6=()=>setTimeout(()=>V[t].s(),1600);choice('g6',ts.map(x=>({t:x})),x=>x.t==t,null,'听一听，是哪辆车的声音？',snd6)}
$('#replay').onpointerdown=()=>{ac();snd6&&snd6()};
function s7(){const t=pick(TYPES),big=R()<.5;choice('g7',shuffle([{t,sz:100,b:1},{t,sz:45,b:0}]),x=>x.b==big,null,(big?'点大的':'点小的')+V[t].n)}
let t8;function s8(){gbusy=false;const ts=shuffle([...TYPES]).slice(0,nC('g8'));t8=pick(ts);const c=$('#c8');c.innerHTML=cardsHTML(ts,x=>`<div class="sil" style="width:100%;display:flex;justify-content:center"><svg viewBox="-20 -60 300 230" style="width:90%">${veh(x)}</svg></div>`);c.querySelectorAll('.card').forEach((el,i)=>el.dataset.t=ts[i]);
 const d=$('#drag8');d.style.transition='none';d.style.transform='';d.style.opacity=1;d.innerHTML=veh(t8);d.classList.add('hint');ask('把'+V[t8].n+'拖到它的影子上');
 c.querySelectorAll('.card').forEach(el=>el.onpointerdown=()=>{ac();if(el.dataset.t==t8)win8(el);else hint()})}
function win8(el){if(gbusy)return;gbusy=true;W.g8=wn('g8')+1;const d=$('#drag8');d.style.opacity=0;el.querySelector('.sil').classList.remove('sil');act(el.querySelector('svg'),t8);setTimeout(()=>celebrate(()=>{if(cur=='g8')s8()},t8),500)}
(()=>{const t=$('#drag8');let sx,sy,dr=false;t.addEventListener('pointerdown',e=>{if(gbusy)return;ac();pop();dr=true;sx=e.clientX;sy=e.clientY;t.classList.remove('hint');t.style.transition='none';try{t.setPointerCapture(e.pointerId)}catch(_){}});t.addEventListener('pointermove',e=>{if(dr)t.style.transform=`translate(${e.clientX-sx}px,${e.clientY-sy}px)`});t.addEventListener('pointerup',e=>{if(!dr)return;dr=false;const el=[...document.querySelectorAll('#c8 .card')].find(g=>{const r=g.getBoundingClientRect();return e.clientX>r.left-30&&e.clientX<r.right+30&&e.clientY>r.top-30&&e.clientY<r.bottom+60});t.style.transition='transform .4s';t.style.transform='';t.classList.add('hint');if(el){el.dataset.t==t8?win8(el):hint()}else if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>30)hint();else ask(lastQ)})})();
/* ---------- progress road ---------- */
let total=+(localStorage.getItem('tt_tot')||0);const unl=()=>Math.min(TYPES.length,1+Math.floor(total/3));
function drawRoad(){$('#road').innerHTML=TYPES.map((t,i)=>`<span class="${i<unl()?'':'lock'}"><svg viewBox="-20 -60 300 230">${veh(t)}</svg></span>`).join('')}
function addWin(){const before=unl();total++;try{localStorage.setItem('tt_tot',total);localStorage.setItem('tt_w',JSON.stringify(W))}catch(e){}if(unl()>before)say('解锁新车：'+V[TYPES[unl()-1]].n+'！',1700)}
/* ---------- no zoom / menus ---------- */
['contextmenu','gesturestart','dblclick','selectstart'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
drawRoad();addEventListener('load',()=>{if(location.hash)show(location.hash.slice(1))});
</script>
<script src="phaser.min.js"></script><script src="play.js"></script><script src="game.js"></script><script src="fun.js"></script>
<script>
(function(){let sx=0;document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchmove',e=>{const w=innerWidth;if(sx<30||sx>w-30||e.touches.length>1||!e.target.closest('#drag8,#ctruck'))e.preventDefault()},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());document.addEventListener('contextmenu',e=>e.preventDefault());
})();
</script></body></html>
